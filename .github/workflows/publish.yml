name: Publish

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'

env:
  GITHUB_IMAGE_REPO: ghcr.io/${{ github.repository_owner }}/robin
  GITHUB_IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/robin:${{ github.sha }}

jobs:
  build:
    name: build and push the image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          push: true
          tags: ${{ env.GITHUB_IMAGE_NAME }}
          build-args: |
            BUILD_VERSION=${{ github.sha }}
          cache-from: |
            type=gha
            type=registry,ref=${{ env.GITHUB_IMAGE_REPO }}:buildcache
          cache-to: |
            type=gha,mode=max
            type=registry,ref=${{ env.GITHUB_IMAGE_REPO }}:buildcache,mode=max
          platforms: linux/amd64
