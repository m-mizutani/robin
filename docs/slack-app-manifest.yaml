# Slack app manifest for Robin.
#
# Replace robin.example.com with the public URL of your server (the value of
# ROBIN_BASE_URL), then create the app at https://api.slack.com/apps with
# "Create New App" -> "From an app manifest". See docs/setup.md.
_metadata:
  major_version: 2
  minor_version: 1
display_information:
  name: Robin
  description: An AI agent that works in Slack and on the web.
features:
  bot_user:
    display_name: robin
    always_online: true
  shortcuts:
    # Shown in the "More actions" menu of every message; Robin deletes only
    # its own messages, and only for the user who asked for them.
    - name: Delete Robin message
      type: message
      callback_id: robin_delete_message
      description: Delete a message Robin posted for you
oauth_config:
  redirect_urls:
    - https://robin.example.com/api/v1/auth/callback
  scopes:
    bot:
      # Receive app_mention events.
      - app_mentions:read
      # Post, update and delete Robin's messages (chat.postMessage,
      # chat.update, chat.delete) and post login prompts (chat.postEphemeral).
      - chat:write
      # Read the thread of a mention (conversations.replies) in public
      # channels, private channels and group DMs.
      - channels:history
      - groups:history
      - mpim:history
      # Read the display name of a user who signs in (users.info).
      - users:read
      # Check the channel of a scheduled message, its archived state and its
      # members, in public and private channels (conversations.info,
      # conversations.members).
      - channels:read
      - groups:read
    user:
      # Requested from each user at sign-in; used to search messages on the
      # user's behalf (search.messages accepts only user tokens).
      - search:read
settings:
  event_subscriptions:
    request_url: https://robin.example.com/hooks/slack/event
    bot_events:
      - app_mention
  interactivity:
    is_enabled: true
    request_url: https://robin.example.com/hooks/slack/interaction
  org_deploy_enabled: false
  socket_mode_enabled: false
  # Robin stores long-lived user tokens. Token rotation cannot be turned off
  # once enabled, so keep it disabled.
  token_rotation_enabled: false
